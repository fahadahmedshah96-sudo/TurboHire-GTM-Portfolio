    name: RippleHire
    group: core
    relationship: Direct product overlap in enterprise hiring automation
    focus:
      - enterprise hiring
      - high-volume hiring
      - recruitment automation
    official_url: "https://www.ripplehire.com/"
    linkedin_url: "https://www.linkedin.com/company/ripplehire/"
    google_news_rss: "https://news.google.com/rss/search?q=%22RippleHire%22&hl=en-IN&gl=IN&ceid=IN:en"

