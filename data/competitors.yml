schema_version: 1
purpose: Track public market signals relevant to TurboHire's positioning, product narrative, and go-to-market activity.
source_policy:
  google_news: discovery_only
  linkedin: manual_review_or_approved_integration
  verification: Verify material claims through an official company source or a credible publication before marking
    them verified.
  human_review_required: true
  coverage_note: Google News RSS is an expanded discovery feed, not exhaustive monitoring. LinkedIn company pages
    are reference links and are not scraped by this workflow.
event_types:
- acquisitions_and_mergers
- funding_and_investor_rounds
- partnerships_and_integrations
- product_and_ai_launches
- customer_wins_and_case_studies
- leadership_changes
- geographic_or_segment_expansion
- regulatory_security_and_compliance
- layoffs_and_restructuring
