name: Refresh competitor news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: competitor-news-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML reader
        run: python -m pip install pyyaml

      - name: Fetch competitor news
        run: python scripts/fetch_competitor_news.py

      - name: Save updated news to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitor-news.json

          if git diff --cached --quiet; then
            echo "No changes to competitor news."
          else
            git commit -m "Refresh competitor news"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
